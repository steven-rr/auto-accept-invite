<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoAcceptInvite icon options</title>
<style>
  /* Icon options for the CurseForge project logo. Colours follow the banner: black, gold, green tick.
     Open this file for the comparison sheet, or add ?icon=a (b, c, d) for one icon alone at full size.
     render-icons.ps1 turns both into PNGs. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #17171c; color: #e9e6df; }
  body.single { background: transparent; width: 512px; height: 512px; overflow: hidden; }
  body.single svg { display: block; width: 512px; height: 512px; }

  .sheet { width: 1500px; padding: 36px 40px 44px; }
  .sheet h1 { font-size: 30px; font-weight: 600; margin-bottom: 6px; }
  .sheet p { font-size: 18px; color: #a39e93; margin-bottom: 26px; }
  .row { display: flex; align-items: center; gap: 0; margin-bottom: 18px; border-radius: 18px; overflow: hidden; }
  .name { width: 250px; padding: 0 26px; font-size: 21px; line-height: 1.3; }
  .name b { display: block; font-size: 26px; color: #ffe29a; }
  .strip { display: flex; align-items: center; gap: 34px; padding: 22px 34px; height: 300px; }
  .strip.dark { background: #0d0d10; width: 660px; }
  .strip.light { background: #ecebe7; width: 510px; }
  .strip svg, .strip img { display: block; }
</style>
</head>
<body>

<!-- Shared paint: defined once, used by every icon through its own copy (ids are suffixed per icon).
     The drawings sit in plain-text script blocks, not templates: a template would read them as HTML,
     where a self-closing <circle/> swallows whatever follows it. -->
<script type="text/plain" id="defs">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2a2a33"/><stop offset="1" stop-color="#09090c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/><stop offset="0.45" stop-color="#f6bd3f"/><stop offset="1" stop-color="#b06c17"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a544"/><stop offset="1" stop-color="#7c4c12"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ff8c"/><stop offset="1" stop-color="#2fbf36"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#bg)" stroke="url(#gold)" stroke-width="14"/>
  <rect x="31" y="31" width="450" height="450" rx="93" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</script>

<!-- A: a party of three, accepted. -->
<script type="text/plain" id="icon-a">
  <g fill="url(#goldDim)">
    <circle cx="150" cy="212" r="44"/>
    <path d="M72 386 V346 A78 78 0 0 1 228 346 V386 A20 20 0 0 1 208 406 H92 A20 20 0 0 1 72 386 Z"/>
    <circle cx="362" cy="212" r="44"/>
    <path d="M284 386 V346 A78 78 0 0 1 440 346 V386 A20 20 0 0 1 420 406 H304 A20 20 0 0 1 284 386 Z"/>
  </g>
  <g fill="url(#gold)" stroke="#0b0b0e" stroke-width="12" paint-order="stroke">
    <circle cx="256" cy="184" r="60"/>
    <path d="M150 404 V366 A106 106 0 0 1 362 366 V404 A24 24 0 0 1 338 428 H174 A24 24 0 0 1 150 404 Z"/>
  </g>
  <circle cx="384" cy="384" r="78" fill="url(#green)" stroke="#0b0b0e" stroke-width="14"/>
  <path d="M348 386 l26 26 l48 -56" fill="none" stroke="#06310c" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</script>

<!-- B: an invite, accepted. -->
<script type="text/plain" id="icon-b">
  <g transform="rotate(-6 256 256)">
    <rect x="86" y="140" width="340" height="232" rx="30" fill="#15151b" stroke="url(#gold)" stroke-width="20"/>
    <path d="M100 160 L256 284 L412 160" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 354 L206 262 M408 354 L306 262" fill="none" stroke="url(#goldDim)" stroke-width="12" stroke-linecap="round"/>
  </g>
  <circle cx="380" cy="372" r="88" fill="url(#green)" stroke="#0b0b0e" stroke-width="14"/>
  <path d="M340 374 l30 30 l54 -62" fill="none" stroke="#06310c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</script>

<!-- C: one player, accepted. The simplest; made to stay clear when very small. -->
<script type="text/plain" id="icon-c">
  <g fill="url(#gold)">
    <circle cx="224" cy="182" r="72"/>
    <path d="M92 400 V368 A132 132 0 0 1 356 368 V400 A28 28 0 0 1 328 428 H120 A28 28 0 0 1 92 400 Z"/>
  </g>
  <circle cx="370" cy="366" r="96" fill="url(#green)" stroke="#0b0b0e" stroke-width="16"/>
  <path d="M326 368 l33 33 l60 -69" fill="none" stroke="#06310c" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</script>

<!-- D: accepted at once: a tick with speed lines. -->
<script type="text/plain" id="icon-d">
  <path d="M84 206 h74 M60 262 h84 M84 318 h74" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <path d="M190 262 l64 66 l136 -156" fill="none" stroke="#0b0b0e" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 262 l64 66 l136 -156" fill="none" stroke="url(#green)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
</script>

<script>
  var NAMES = { a: ["A", "A party, accepted"], b: ["B", "An invite, accepted"], c: ["C", "One player, accepted"], d: ["D", "Accepted at once"] };

  // One icon as an SVG string. Gradient ids get a suffix so several icons can share a page.
  function icon(key, size, suffix) {
    var inner = document.getElementById("defs").textContent + document.getElementById("icon-" + key).textContent;
    inner = inner.replace(/id="(\w+)"/g, 'id="$1' + suffix + '"').replace(/url\(#(\w+)\)/g, "url(#$1" + suffix + ")");
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="' + size + '" height="' + size + '">' + inner + "</svg>";
  }

  var wanted = new URLSearchParams(location.search).get("icon");
  if (wanted) {
    document.body.className = "single";
    document.body.insertAdjacentHTML("beforeend", icon(wanted, 512, "x"));
  } else {
    var sizes = [256, 128, 64, 32], html = '<div class="sheet"><h1>AutoAcceptInvite: icon options</h1>' +
      "<p>Each one at 256, 128, 64 and 32 pixels, on a dark and on a light page. CurseForge shows the logo at 64.</p>";
    var rows = Object.keys(NAMES).map(function (key, n) {
      function strip(tone, list) {
        return '<div class="strip ' + tone + '">' + list.map(function (s) { return icon(key, s, key + tone + s); }).join("") + "</div>";
      }
      return '<div class="row"><div class="name"><b>' + NAMES[key][0] + "</b>" + NAMES[key][1] + "</div>" +
        strip("dark", sizes) + strip("light", sizes.slice(1)) + "</div>";
    });
    function current(tone, list) {
      return '<div class="strip ' + tone + '">' + list.map(function (s) {
        return '<img src="logo.png" width="' + s + '" height="' + s + '" alt="">';
      }).join("") + "</div>";
    }
    rows.push('<div class="row"><div class="name"><b>Now</b>The current logo</div>' + current("dark", sizes) + current("light", sizes.slice(1)) + "</div>");
    document.body.insertAdjacentHTML("beforeend", html + rows.join("") + "</div>");
  }
</script>
</body>
</html>
